---
deployment:
  tasks:
    # Set paths
    - export LARAVEL_PATH=/home/snusegypt/laravel-app/public_html
    - export SUBDOMAIN_PATH=/home/snusegypt/public_html/tester

    # Copy ALL Laravel public files to subdomain
    - /bin/cp -R $LARAVEL_PATH/* $SUBDOMAIN_PATH/
    - /bin/cp $LARAVEL_PATH/.htaccess $SUBDOMAIN_PATH/ 2>/dev/null || true

    # Set permissions
    - chmod -R 755 $SUBDOMAIN_PATH
    - chmod -R 755 $LARAVEL_PATH/storage 2>/dev/null || true
    - chmod -R 755 $LARAVEL_PATH/bootstrap/cache 2>/dev/null || true
