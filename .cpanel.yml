---
deployment:
  tasks:
    # Set paths
    - export REPO_PATH=/home/snusegypt/repositories/snusegypt2026
    - export LARAVEL_ROOT=$REPO_PATH/public_html
    - export SUBDOMAIN_PATH=/home/snusegypt/public_html/tester

    # Copy ALL Laravel files to subdomain (index.php, .htaccess, css, js, images, etc.)
    - /bin/cp -R $LARAVEL_ROOT/* $SUBDOMAIN_PATH/
    - /bin/cp $LARAVEL_ROOT/.htaccess $SUBDOMAIN_PATH/ 2>/dev/null || true

    # Set permissions
    - chmod -R 755 $SUBDOMAIN_PATH
    - chmod -R 755 $LARAVEL_ROOT/storage
    - chmod -R 755 $LARAVEL_ROOT/bootstrap/cache
